name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  php-syntax:
    name: PHP syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          coverage: none

      - name: Check all PHP files for syntax errors
        run: |
          shopt -s globstar nullglob
          failed=0
          count=0
          while IFS= read -r -d '' file; do
            count=$((count + 1))
            if ! php -l "$file" > /dev/null; then
              failed=1
            fi
          done < <(find . -path './pp-external/*' -prune -o -name '*.php' -print0)
          echo "Checked $count PHP files."
          exit $failed

  no-secrets:
    name: Block secrets and local state
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail if secrets or local state are committed
        run: |
          blocked='(^|/)pp-config\.php$|(^|/)\.env$|(^|/)install\.lock$|(^|/)maintenance\.lock$|(^|/).*\.sql$|(^|/)cache/.*\.json$'
          offenders=$(git ls-files | grep -E "$blocked" || true)
          if [ -n "$offenders" ]; then
            echo "::error::Blocked files are committed:"
            echo "$offenders"
            exit 1
          fi
          echo "No secrets or local-state files committed."
